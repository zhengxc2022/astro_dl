# Nginx configuration for Astronomical Image Downloader
# Optional: Use this if you want to use Nginx as reverse proxy

# For HTTP (no SSL)
server {
    listen 80;
    server_name your-server-name-or-ip;

    # Restrict access to group network only
    allow 192.168.0.0/16;    # Allow private network
    allow 10.0.0.0/8;        # Allow private network
    allow 172.16.0.0/12;     # Allow private network
    allow 127.0.0.1;         # Allow localhost
    deny all;                # Deny all other IPs

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for large file downloads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Increase max body size for large requests
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/dltools_access.log;
    error_log /var/log/nginx/dltools_error.log;
}

